<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock–Paper–Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="big-conatiner">
        <div class="container" >
            <button class=" btn"  onclick="buttonClicked('Rock')">
            <img class=" imageClass" src="img/rock.png">
        </button>
        <button class=" btn" onclick="buttonClicked('Paper')">
            <img class=" imageClass" src="img/paper.png">
        </button>
        <button class=" btn"   onclick="buttonClicked('Scissor')">
            <img class=" imageClass" src="img/scissor.jpg">
        </button>
        <button class=" btn"  onclick="resetScore()">Reset</button>
        </div>
        
        <p class="result"></p>
        <p class="score"></p>
        <!-- <input onkeydown="typing(event)" class="input">
        <p class="inputMessage"></p> -->
    </div>
    
</body>
<script src="index.js" defer></script>
</html>
